version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rs:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "admin-ui"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
        exclude-patterns:
          - "vite-plus"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
